name: build-desktop

# タグ(v*)を push すると Release に成果物を添付。手動実行(Actions画面のRun workflow)でも動く
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # 実行OSのインストーラだけを作る（mac→dmg/zip, windows→exe）。署名はしない
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # CIから直接ダウンロードできるように成果物を保存（タグなしの手動実行でも取得可）
      - uses: actions/upload-artifact@v4
        with:
          name: SeatMap-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          if-no-files-found: ignore

      # タグ push のときは GitHub Release を作成/更新して成果物を添付
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
